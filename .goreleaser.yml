version: 2

project_name: hikma

before:
  hooks:
    - go test ./...

builds:
  - id: hikma
    main: ./cmd/hikma
    binary: hikma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/hasankhatib/hikma-ai/cmd/hikma/commands.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: HasanKhatib
    name: hikma-ai
  draft: false
  prerelease: auto

homebrew_casks:
  - name: hikma
    repository:
      owner: HasanKhatib
      name: homebrew-tap
      branch: main
      # A write-enabled deploy key on the tap repo; the workflow writes the key to a file.
      git:
        url: git@github.com:HasanKhatib/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_KEY_PATH" }}'
    directory: Casks
    homepage: https://github.com/HasanKhatib/hikma-ai
    description: Install, create, and publish reusable AI-agent skills from any repo
    license: MIT
    binaries:
      - hikma
    # The binary is not notarized yet; clear the download quarantine flag after install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hikma"], must_succeed: false
          end
    # Pre-releases (for example v0.1.0-rc.1) must not update the tap.
    skip_upload: auto

changelog:
  use: github
