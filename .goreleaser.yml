version: 2

project_name: hikma

before:
  hooks:
    - go test ./...

builds:
  - id: hikma
    main: ./cmd/hikma
    binary: hikma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/hasankhatib/hikma-ai/cmd/hikma/commands.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: hasankhatib
    name: hikma-ai
  draft: false
  prerelease: auto

changelog:
  use: github
