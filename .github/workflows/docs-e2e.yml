name: Docs e2e

# Runs the docs site in real browsers (Chromium, Firefox, WebKit, and two phone
# profiles): the home page fits one screen, never scrolls sideways, paints in
# light and dark, the stage buttons seek the scene, and axe finds no serious
# accessibility violations.

on:
  pull_request:
    paths: ["docs/site/**", ".github/workflows/docs-e2e.yml"]
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/docs-e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            docs/site/test-results
            docs/site/playwright-report
          retention-days: 7
