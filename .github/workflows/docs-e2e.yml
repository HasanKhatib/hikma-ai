name: Docs e2e

# Runs the docs site in real browsers (Chromium, Firefox, WebKit, and two phone
# profiles): the home page fits one screen, never scrolls sideways, paints in
# light and dark, the stage buttons seek the scene, and axe finds no serious
# accessibility violations. Manual only: run it from the Actions tab before a
# large docs or home page change. The docs-build job in CI already fails on
# dead links for every pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            docs/site/test-results
            docs/site/playwright-report
          retention-days: 7
