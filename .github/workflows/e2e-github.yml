name: GitHub e2e

# Runs the real binary against a real throwaway GitHub registry: create, push,
# install, verify, change upstream, update, verify. Manual only, because it
# writes to a repository and needs a token.
#
# Setup (once): create an empty private repository to use as the registry, a
# fine-grained token limited to that repository with "Contents: read and
# write", then
#   gh variable set E2E_REGISTRY --body owner/throwaway-repo
#   gh secret set E2E_GITHUB_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    concurrency:
      group: e2e-github-registry
      cancel-in-progress: false
    steps:
      - name: Check the setup
        shell: bash
        env:
          REGISTRY: ${{ vars.E2E_REGISTRY }}
          TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: |
          [ -n "$REGISTRY" ] || { echo "::error::Set the E2E_REGISTRY repository variable (owner/repo of the throwaway registry)."; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::Set the E2E_GITHUB_TOKEN secret (fine-grained token with Contents read and write on that repository)."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 -v -run TestGitHubRoundTrip ./e2e
        env:
          HIKMA_E2E_REPO: ${{ vars.E2E_REGISTRY }}
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
