name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the jobs below a change can affect, so a docs-only pull
  # request does not run the Go matrix. hygiene and vulncheck always run, which also
  # keeps a run named CI on every commit for the release gate to wait for.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
      release: ${{ steps.paths.outputs.release }}
      scripts: ${{ steps.paths.outputs.scripts }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (a new branch, a force-push, or an API error) means no
          # file list, and scripts/ci-changes.sh then runs every job.
          files=""
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
              --jq '.files[] | .filename, (.previous_filename // empty)') || files=""
          fi
          printf '%s\n' "$files" | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: no agent attribution in commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force-push has no usable "before"; skip rather than scan all history.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          if git log --format='%h %B' "$BASE..$HEAD" | grep -iE '^(.* )?co-authored-by:.*(claude|anthropic)|generated with .*claude'; then
            echo "::error::Remove agent co-author or 'Generated with' lines from the commit messages (see AGENTS.md)."
            exit 1
          fi
      - name: pull request title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The squash-merge title is the commit, which decides the version and is the release note.
          if ! grep -qE '^(feat|fix|perf|docs|chore|ci|test|refactor|style|build|revert)(\([a-z0-9._-]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::The pull request title decides the version and becomes the release note. Start it with feat:, fix:, perf:, docs:, chore:, ci:, test:, refactor:, style:, build:, or revert: (see AGENTS.md)."
            exit 1
          fi
      - name: CI path filters
        run: bash scripts/test-ci-changes.sh
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # govulncheck needs a current Go; this checks the dependencies
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  install-script:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: install script against a fake release
        run: bash scripts/test-install.sh
      - name: Homebrew formula rendering
        if: runner.os != 'Windows'
        run: bash scripts/test-formula.sh

  # A pull request gets the dry run. On main the release workflow does the real
  # build moments later, so a second one here would only repeat it.
  release-dry-run:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the nav shows the latest release tag
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Build the docs (fails on dead links)
        working-directory: docs/site
        run: |
          npm ci
          npm run docs:build

