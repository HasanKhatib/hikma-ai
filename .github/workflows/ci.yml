name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
      - run: go build ./...

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: no agent attribution in commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force-push has no usable "before"; skip rather than scan all history.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          if git log --format='%h %B' "$BASE..$HEAD" | grep -iE '^(.* )?co-authored-by:.*(claude|anthropic)|generated with .*claude'; then
            echo "::error::Remove agent co-author or 'Generated with' lines from the commit messages (see AGENTS.md)."
            exit 1
          fi
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # govulncheck needs a current Go; this checks the dependencies
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: install script against a fake release
        run: bash scripts/test-install.sh
      - name: Homebrew formula rendering
        if: runner.os != 'Windows'
        run: bash scripts/test-formula.sh

  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Build the docs (fails on dead links)
        working-directory: docs/site
        run: |
          npm ci
          npm run docs:build

