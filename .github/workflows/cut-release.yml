name: Cut release

# Merging a changelog entry for a new version is the release.
#
# After CI or Terminal finishes on main, if the newest "## [X.Y.Z]" heading in
# CHANGELOG.md has no tag yet and every check on that commit has passed, this
# creates the tag and starts the Release workflow on it. Whichever of the two
# finishes last is the run that releases.
#
# The Release workflow is started with workflow_dispatch because a tag pushed with
# the default token does not start other workflows, but a dispatch does. Pushing
# a v* tag by hand still releases, as before.
#
# Run it by hand with dry_run to see what it would do without releasing.

on:
  workflow_run:
    workflows: [CI, Terminal]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only say what would be released
        type: boolean
        default: false

permissions:
  contents: write # create the tag
  actions: write  # start the Release workflow

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: cut
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Is there a version to release?
        id: next
        run: |
          version=$(bash scripts/next-release.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing to release: the newest CHANGELOG version is already tagged."
          else
            echo "CHANGELOG.md has $version, which has no tag yet."
          fi

      - name: Have all checks on this commit passed?
        id: checks
        if: steps.next.outputs.version != ''
        run: |
          # Every check run on the commit except this job. Anything still running
          # means a later workflow_run will check again; anything failed stops here.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "cut")]')
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
          failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not)) | .name] | join(", ")' <<<"$runs")
          total=$(jq length <<<"$runs")
          if [ "$total" = "0" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not releasing: no checks were found on $SHA, so nothing has verified it."
          elif [ -n "$failed" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not releasing: these checks did not pass: $failed. Fix them, then run this workflow by hand."
          elif [ "$pending" != "0" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "$pending checks are still running; the one that finishes last will release."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "All $total checks passed."
          fi

      - name: Tag and start the release
        if: steps.next.outputs.version != '' && steps.checks.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would tag v$VERSION at $SHA and start the Release workflow."
            exit 0
          fi
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION"
          echo "Tagged v$VERSION at $SHA and started the Release workflow."
          {
            echo "### Released v$VERSION"
            echo "Tagged \`$SHA\` and started [Release](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
